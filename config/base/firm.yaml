# Claude London Trading Firm — base configuration (governing spec §24)
# Validated by src/trading_firm/config.py; invariants are enforced at load time.
# live_allowed stays empty until the promotion process and owner approval (§12.5, §24).

firm:
  name: Claude London Trading Firm
  environment: research
  starting_capital_usd: 250.00
  profit_target: null
  control_timezone: America/Chicago
  market_timezone: Europe/London

risk:
  tier_anchor_usd: 250.00
  scaling_multiplier: 2.0
  current_equity_risk_contraction: true
  max_open_positions: 1
  max_trades_per_session: 2
  max_exceptional_trades_per_session: 1
  initial_session_loss_limit_usd: 25.00
  initial_weekly_loss_limit_usd: 37.50
  initial_live_floor_usd: 200.00
  week_boundary: iso_week_europe_london
  tier_promotion_requires_owner_approval: true
  deposits_advance_milestones: false
  margin_utilization_cap_fraction: 0.30
  drawdown_states:
    caution_from_anchor: -0.05
    restricted_from_anchor: -0.10
  stop_widening: false
  averaging_down: false
  martingale: false
  recovery_sizing: false

risk_ladder:
  standard:
    initial_usd: 2.50
    initial_equity_fraction: 0.01
  strong:
    initial_usd: 7.50
    initial_equity_fraction: 0.03
  high:
    initial_usd: 12.50
    initial_equity_fraction: 0.05
  exceptional:
    initial_usd: 25.00
    initial_equity_fraction: 0.10
    prohibited_after_session_loss: true
    human_approval_during_probation: true

execution:
  require_broker_stop_confirmation: true
  reject_stale_data: true
  reject_abnormal_spread: true
  reject_unknown_news_state: true
  reject_minimum_size_overrisk: true
  idempotency_required: true
  fail_closed: true

data:
  economic_calendar_source: financial_modeling_prep
  economic_calendar_endpoint: stable/economics-calendar
  economic_calendar_min_plan: starter

session:
  anchor_timezone: Europe/London
  startup_london: "07:15"
  asian_range_final_london: "07:30"
  briefing_london: "07:40"
  activation_london: "08:00"
  entry_cutoff_london: "10:30"
  flatten_london: "11:00"
  display_timezone: America/Chicago
  holiday_calendar_required: true
  # §31.1 owner-ratified execution tolerances (amendment A-4, 2026-08-06).
  # Reporting and qualification only: these never widen a trading window.
  # entry_cutoff and flatten carry ZERO authority tolerance; the seconds below
  # are handler/initiation jitter for the log, per §31.1.
  timing_tolerances_seconds:
    pre_startup: 120
    briefing: 120
    activation: 60
    entry_cutoff: 5
    flatten: 5
  flat_verification_deadline_seconds: 60

# v2 §6/§6A/§6.8: the senior-trader pair may build situation-specific theses.
# Live novelty is empty and exceptional risk is N0-only — an unvalidated idea
# cannot reach live exposure regardless of how persuasive its narrative is.
adaptive_trading:
  senior_trader_pair_enabled: true
  independent_first_pass_required: true
  market_state_packet_checksum_required: true
  allowed_live_novelty_classes: []
  exceptional_risk_allowed_novelty_classes:
    - N0
  narrative_only_candidates_rejected: true

# v2 §11: only registry features may be referenced; production is empty until
# each feature has passed validation.
feature_registry:
  production_allowed: []
  research_allowed:
    - session_features_v1
    - structure_features_v1

strategies:
  live_allowed: []
  research_allowed:
    - london_breakout
    - asian_range_sweep_reversal
    - london_continuation
  specialist_research_allowed:
    - london_breakout
    - asian_range_sweep_reversal
    - london_continuation

instruments:
  research_priority:
    - GBP_USD
    - EUR_USD
  live_allowed: []
