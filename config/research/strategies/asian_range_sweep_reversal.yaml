# Asian Range Sweep and Reversal — research manifest (§11). Rule logic
# implemented 2026-07-30 (strategies/sweep_reversal.py); first-guess params
# declared below BEFORE any replay of this strategy ran (§12.4). Research
# only; no risk permissions.
strategy_id: asian_range_sweep_reversal
version: 0.1.0
status: research
instruments: [GBP_USD, EUR_USD]
session_definition: london_v1
features: [session_features_v1]
entry_rules:
  - Sweep beyond an Asian range extreme that fails acceptance and displaces back inside
invalidation_rules:
  - Beyond the sweep extreme
exit_rules:
  - Opposing range liquidity target or mandatory flatten boundary
expiration_rules:
  - Candidate expires at the entry cutoff (10:30 London)
regime_filters:
  - Asian range width 15-60 pips (as london_breakout)
  - Sweep depth 3-25 pips beyond the extreme; deeper is acceptance (no setup)
  - Close back inside within 3 bars of the sweep start, else acceptance
news_filters:
  - No entry when the economic-calendar state is unknown (fail closed, §0.10)
spread_limits:
  max_spread_pips: 2.5
slippage_limits:
  max_slippage_pips: 1.0
params:
  min_sweep_pips: 3
  max_sweep_pips: 25
  reentry_within_bars: 3
  stop_buffer_pips: 2
  stop_max_pips: 40
  min_range_pips: 15
  max_range_pips: 60
risk_permissions:
  standard: false
  strong: false
  high: false
  exceptional: false
validation_record_id: null
promotion_record_id: null
