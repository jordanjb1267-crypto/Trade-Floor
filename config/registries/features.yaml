# Feature metadata registry (§30.7) — the existing registry, extended.
# One record per approved feature id; the flat lists in firm.yaml and the
# adaptive policy manifest are validated views of this file (CI-enforced).
# New calculations begin as research and cannot affect live decisions.
feature_registry:
  version: 1.0.0
  features:
    - feature_id: session_features_v1.asian_high
      status: research
      asset_classes: [FX_SPOT]
      instruments: [GBP_USD, EUR_USD]
      timeframes: [M5]
      calculation_module: trading_firm.features.engine
      required_inputs: [m5_bars_asian_window, m5_bars_pre_london_window]
      lookback_requirements: {window: 'asian 00:00-07:00 London + pre-London 07:00-08:00'}
      output_type: price
      null_behavior: absent_when_window_uncovered_fail_closed
      warmup_behavior: requires_full_window_coverage
      freshness_policy: recomputed_per_session_at_boundary
      purpose: >
        Decimal price level of the Asian-session high.
      known_failure_modes:
        - "partial window coverage (handled: fail closed, feature absent)"
        - "holiday or weekend gap in bars (handled: absent or walk-back)"
      leakage_review_status: not_reviewed
      validation_report_ids: []
      owner_approval_id: null

