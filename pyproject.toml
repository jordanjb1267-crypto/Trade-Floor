[project]
name = "trading-firm"
version = "0.1.0"
description = "Claude London Trading Firm — deterministic runtime and research framework (governing spec)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests/a2_guard.py` is a shared helper, not a test module: the A-2
# pressure-invariance check (§5.1) lives in one place so strengthening it
# strengthens every module that imports it.
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
